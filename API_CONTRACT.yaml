---
openapi: 3.0.3
info:
  title: SpiceMama Website API
  version: 1.0.0
  description: |
    Phase-1 development contract. No backend is implemented yet. Same-origin PHP sessions;
    all admin responses use Cache-Control: no-store. Public products must be published
    and belong to active categories; all other public detail lookups return 404.
    Product/category lists sort by sort_order ASC, id ASC; images by sort_order ASC, id ASC.
    First image is primary; is_primary is not a separate API field. Descriptions are plain text.
    Unknown request properties are rejected. Invalid JSON/query syntax returns 400;
    valid but invalid field values return 422. Duplicate slugs return 409.
    IDs are positive JSON-safe integers. No product/category hard-delete API.
servers:
- url: "/api/v1"
paths:
  "/products":
    get:
      summary: List published products
      parameters:
      - &2
        name: category
        in: query
        description: Exact category slug; unknown/inactive category gives empty public
          results.
        schema:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 160
      - &3
        name: q
        in: query
        description: Trimmed, case-insensitive literal substring of product name or
          short_description; empty means no search.
        schema:
          type: string
          maxLength: 100
      - &4
        name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
      - &5
        name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 12
      responses:
        '200':
          description: Published products and pagination
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Product"
                  meta:
                    "$ref": "#/components/schemas/Pagination"
        '400': &1
          "$ref": "#/components/responses/ErrorResponse"
        '422': *1
        '500': *1
        '503': *1
      description: Out-of-range page returns empty data with actual totals. Zero matches
        yields total_pages=0.
      operationId: get_products
  "/products/{slug}":
    get:
      summary: Retrieve one published product
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 200
      responses:
        '200':
          "$ref": "#/components/responses/ProductResponse"
        '404':
          "$ref": "#/components/responses/ErrorResponse"
        '400': *1
        '422': *1
        '500': *1
        '503': *1
      operationId: get_products_slug
  "/categories":
    get:
      summary: List active categories
      responses:
        '200':
          description: Active categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Category"
                required:
                - data
        '400': *1
        '422': *1
        '500': *1
        '503': *1
      operationId: get_categories
  "/admin/csrf":
    get:
      summary: Obtain session CSRF token, including pre-login session
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - csrf_token
                    properties:
                      csrf_token:
                        type: string
                        minLength: 1
        '400': *1
        '422': *1
        '500': *1
        '503': *1
      description: Creates pre-login session if needed. Returns current token. Token
        rotates after successful login; fetch again before mutations. Never cache
        token.
      operationId: get_admin_csrf
  "/admin/login":
    post:
      summary: Authenticate admin using CSRF token
      parameters:
      - "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 1024
              additionalProperties: false
      responses:
        '200':
          "$ref": "#/components/responses/AdminResponse"
        '401':
          "$ref": "#/components/responses/ErrorResponse"
        '403':
          "$ref": "#/components/responses/ErrorResponse"
        '429':
          description: Login throttled
          headers:
            Retry-After:
              description: Seconds before retry
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400': *1
        '422': *1
        '500': *1
        '503': *1
        '415': *1
      description: Requires pre-login CSRF token. Generic 401 for invalid/inactive
        account. Regenerates session ID and rotates token on success. Persistent account
        and client throttling; 429 includes Retry-After seconds.
      operationId: post_admin_login
  "/admin/me":
    get:
      summary: Get current admin session
      security:
      - sessionCookie: []
      responses:
        '200':
          "$ref": "#/components/responses/AdminResponse"
        '401':
          "$ref": "#/components/responses/ErrorResponse"
        '400': *1
        '422': *1
        '500': *1
        '503': *1
        '403': *1
      operationId: get_admin_me
  "/admin/logout":
    post:
      summary: End admin session
      security:
      - sessionCookie: []
      parameters:
      - "$ref": "#/components/parameters/Csrf"
      responses:
        '204':
          description: Session invalidated
        '401':
          "$ref": "#/components/responses/ErrorResponse"
        '400': *1
        '422': *1
        '500': *1
        '503': *1
        '403': *1
        '415': *1
      description: Invalidate server session and expire cookie. Requires authentication
        and CSRF. 204 has no response body.
      operationId: post_admin_logout
  "/admin/products":
    get:
      summary: List products including drafts (admin only)
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Admin product list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Product"
                  meta:
                    "$ref": "#/components/schemas/Pagination"
        '400': *1
        '422': *1
        '500': *1
        '503': *1
        '401': *1
        '403': *1
      parameters:
      - *2
      - *3
      - *4
      - *5
      - name: status
        in: query
        schema:
          type: string
          enum:
          - draft
          - published
          - archived
      description: All statuses and inactive categories included unless filtered.
        Same pagination semantics as public list.
      operationId: get_admin_products
    post:
      summary: Create draft product
      security:
      - sessionCookie: []
      parameters:
      - "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProductCreate"
      responses:
        '201':
          "$ref": "#/components/responses/ProductResponse"
        '422':
          "$ref": "#/components/responses/ErrorResponse"
        '400': *1
        '500': *1
        '503': *1
        '401': *1
        '403': *1
        '415': *1
        '409': *1
      operationId: post_admin_products
  "/admin/products/{id}":
    patch:
      summary: Edit product (publishing uses separate endpoint)
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: &6
          type: integer
          minimum: 1
          maximum: 9007199254740991
      - "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProductPatch"
      responses:
        '200':
          "$ref": "#/components/responses/ProductResponse"
        '404':
          "$ref": "#/components/responses/ErrorResponse"
        '422':
          "$ref": "#/components/responses/ErrorResponse"
        '400': *1
        '500': *1
        '503': *1
        '401': *1
        '403': *1
        '415': *1
        '409': *1
      operationId: patch_admin_products_id
    get:
      summary: Get one product including drafts and archived records
      security: &7
      - sessionCookie: []
      parameters:
      - "$ref": "#/components/parameters/Id"
      responses:
        '200':
          "$ref": "#/components/responses/ProductResponse"
        '404': *1
        '400': *1
        '422': *1
        '500': *1
        '503': *1
        '401': *1
        '403': *1
      operationId: get_admin_products_id
  "/admin/products/{id}/status":
    post:
      summary: Set product status (draft/published/archived)
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *6
      - "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - draft
                  - published
                  - archived
              additionalProperties: false
      responses:
        '200':
          "$ref": "#/components/responses/ProductResponse"
        '400': *1
        '422': *1
        '500': *1
        '503': *1
        '401': *1
        '403': *1
        '415': *1
        '409': *1
      description: Any listed status may transition to any other. Unpublish by setting
        draft. First publication sets published_at once. Publishing requires active
        category, nonblank short/full descriptions and at least one image with nonblank
        alt text. Repeating current status succeeds without changing publication time.
        Editing published content must preserve publication requirements.
      operationId: post_admin_products_id_status
  "/admin/categories":
    get:
      summary: List all categories for admin
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Category"
                required:
                - data
        '400': *1
        '422': *1
        '500': *1
        '503': *1
        '401': *1
        '403': *1
      operationId: get_admin_categories
    post:
      summary: Create category
      security:
      - sessionCookie: []
      parameters:
      - "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CategoryCreate"
      responses:
        '201':
          "$ref": "#/components/responses/CategoryResponse"
        '400': *1
        '422': *1
        '500': *1
        '503': *1
        '401': *1
        '403': *1
        '415': *1
        '409': *1
      operationId: post_admin_categories
  "/admin/categories/{id}":
    patch:
      summary: Update category
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *6
      - "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CategoryPatch"
      responses:
        '200':
          "$ref": "#/components/responses/CategoryResponse"
        '400': *1
        '422': *1
        '500': *1
        '503': *1
        '401': *1
        '403': *1
        '415': *1
        '409': *1
      description: Deactivating category hides its products publicly without changing
        their statuses; reactivation restores visibility. No cascade deletion.
      operationId: patch_admin_categories_id
  "/admin/images":
    post:
      summary: Upload product image
      security:
      - sessionCookie: []
      parameters:
      - "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - product_id
              - file
              properties:
                product_id: *6
                file:
                  type: string
                  format: binary
                  description: Binary image; browser sets multipart boundary. Maximum
                    5,242,880 bytes.
                alt_text:
                  type: string
                  maxLength: 255
                  default: ''
              additionalProperties: false
      responses:
        '201':
          "$ref": "#/components/responses/ImageResponse"
        '413':
          "$ref": "#/components/responses/ErrorResponse"
        '422':
          "$ref": "#/components/responses/ErrorResponse"
        '400': *1
        '500': *1
        '503': *1
        '401': *1
        '403': *1
        '415': *1
        '409': *1
      description: 'One JPEG/PNG/WebP file, at most 5,242,880 bytes and subject to
        stricter server limits. No SVG/animated images. Dimensions: each side 1..4096,
        total pixels <=4,000,000. Decode/re-encode within memory budget; reject safely
        on processing failure. Append at end of gallery. Product must exist. Originals
        in repository Images/ are never upload targets.'
      operationId: post_admin_images
  "/admin/images/{id}":
    patch:
      summary: Update image alt text
      security: *7
      parameters:
      - "$ref": "#/components/parameters/Id"
      - &8
        "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ImagePatch"
      responses:
        '200':
          "$ref": "#/components/responses/ImageResponse"
        '404': *1
        '400': *1
        '422': *1
        '500': *1
        '503': *1
        '401': *1
        '403': *1
        '415': *1
        '409': *1
      operationId: patch_admin_images_id
    delete:
      summary: Remove uploaded image and its association
      description: Cannot remove last image of a published product. Primary removal
        promotes first remaining image. Never deletes repository originals. Missing
        image returns 404.
      security: *7
      parameters:
      - "$ref": "#/components/parameters/Id"
      - *8
      responses:
        '204':
          description: Image removed; no body
        '404': *1
        '409': *1
        '400': *1
        '422': *1
        '500': *1
        '503': *1
        '401': *1
        '403': *1
      operationId: delete_admin_images_id
  "/admin/products/{id}/images/order":
    put:
      summary: Replace complete image order; first image becomes primary
      description: Supply every current image ID exactly once, all belonging to this
        product. Empty allowed only for empty gallery. Stale/incomplete/foreign set
        returns 409. Apply atomically while locking product.
      security: *7
      parameters:
      - "$ref": "#/components/parameters/Id"
      - *8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ImageOrder"
      responses:
        '200':
          "$ref": "#/components/responses/ProductResponse"
        '404': *1
        '409': *1
        '400': *1
        '422': *1
        '500': *1
        '503': *1
        '401': *1
        '403': *1
        '415': *1
      operationId: put_admin_products_id_images_order
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: PHPSESSID; Secure, HttpOnly, SameSite=Lax, Path=/. HTTPS required
        outside isolated loopback development. Idle expiry 30 minutes, absolute expiry
        8 hours. Cookie never read by JavaScript.
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema: *6
  schemas:
    ProductImage:
      type: object
      required:
      - id
      - url
      - alt_text
      - sort_order
      properties:
        id: *6
        url:
          type: string
          example: "/uploads/products/sample.webp"
        alt_text:
          type: string
          maxLength: 255
        sort_order: &9
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      description: Public relative URL; no private filesystem path. Array order determines
        primary image.
    Product:
      type: object
      required:
      - id
      - slug
      - name
      - category_id
      - short_description
      - description
      - pack_size_label
      - ingredients
      - status
      - sort_order
      - images
      properties:
        id: *6
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 180
        category_id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        short_description:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 10000
        pack_size_label:
          type: string
          maxLength: 100
          nullable: true
        ingredients:
          type: string
          maxLength: 10000
          nullable: true
        status:
          type: string
          enum:
          - draft
          - published
          - archived
        sort_order:
          type: integer
          minimum: 0
          maximum: 2147483647
        images:
          type: array
          items:
            "$ref": "#/components/schemas/ProductImage"
    Category:
      type: object
      required:
      - id
      - name
      - slug
      - description
      - sort_order
      - is_active
      properties:
        id: *6
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 160
        description:
          type: string
          maxLength: 10000
          nullable: true
        sort_order:
          type: integer
          minimum: 0
          maximum: 2147483647
        is_active:
          type: boolean
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
      required:
      - page
      - per_page
      - total
      - total_pages
    Error:
      type: object
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
      required:
      - error
    ProductCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - slug
      - category_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 200
        category_id: *6
        short_description:
          type: string
          maxLength: 500
          default: ''
        description:
          type: string
          maxLength: 10000
          default: ''
        pack_size_label:
          type: string
          maxLength: 100
          nullable: true
          default: 
        ingredients:
          type: string
          maxLength: 10000
          nullable: true
          default: 
        sort_order: *9
    ProductPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 200
        category_id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        short_description:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 10000
        pack_size_label:
          type: string
          maxLength: 100
          nullable: true
        ingredients:
          type: string
          maxLength: 10000
          nullable: true
        sort_order:
          type: integer
          minimum: 0
          maximum: 2147483647
    CategoryCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 160
        description:
          type: string
          maxLength: 10000
          nullable: true
          default: 
        sort_order: *9
        is_active:
          type: boolean
          default: false
    CategoryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 160
        description:
          type: string
          maxLength: 10000
          nullable: true
        sort_order:
          type: integer
          minimum: 0
          maximum: 2147483647
        is_active:
          type: boolean
    Admin:
      type: object
      required:
      - id
      - email
      - display_name
      properties:
        id: *6
        email:
          type: string
          format: email
        display_name:
          type: string
    ImagePatch:
      type: object
      additionalProperties: false
      required:
      - alt_text
      properties:
        alt_text:
          type: string
          maxLength: 255
    ImageOrder:
      type: object
      additionalProperties: false
      required:
      - image_ids
      properties:
        image_ids:
          type: array
          uniqueItems: true
          items: *6
  requestBodies: {}
  responses:
    ProductResponse:
      description: Product
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                "$ref": "#/components/schemas/Product"
    CategoryResponse:
      description: Category
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                "$ref": "#/components/schemas/Category"
    AdminResponse:
      description: Authenticated admin
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                "$ref": "#/components/schemas/Admin"
    ErrorResponse:
      description: 'Safe API error. Codes: bad_request (400), unauthorized (401),
        csrf_invalid or forbidden (403), not_found (404), conflict (409), payload_too_large
        (413), unsupported_media_type (415), validation_failed (422), rate_limited
        (429), internal_error (500), unavailable (503). Optional fields maps input
        field names to messages; no stack traces, SQL or filesystem paths.'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ImageResponse:
      description: Image metadata
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                "$ref": "#/components/schemas/ProductImage"
