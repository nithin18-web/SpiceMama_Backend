<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Products · Spice Mama admin</title>
<link rel="icon" href="/assets/images/brand/logo-sm.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin" data-auth="pending" data-page="products">
<a class="skip" href="#main">Skip to content</a>
<div class="boot" role="status">Checking your session…</div>
<div class="shell">
  <header class="topbar">
    <a href="/admin/"><img src="/assets/images/brand/logo-sm.webp" width="320" height="201" alt="Spice Mama admin"></a>
    <button type="button" data-open-side aria-controls="side" aria-expanded="false">Menu</button>
  </header>
  <aside class="side" id="side" data-open="false" aria-label="Admin">
    <a class="logo" href="/admin/"><img src="/assets/images/brand/logo-sm.webp" width="320" height="201" alt="Spice Mama admin"></a>
    <nav aria-label="Admin sections">
      <a href="/admin/" data-nav="dashboard">Dashboard</a>
      <a href="/admin/products.html" data-nav="products">Products</a>
      <a href="/admin/product-edit.html" data-nav="new-product">Add a product</a>
      <a href="/admin/categories.html" data-nav="categories">Categories</a>
      <a href="/" target="_blank" rel="noopener">View the website ↗</a>
    </nav>
    <div class="who">
      <span>Signed in as <strong data-admin-name>…</strong><span data-admin-email style="opacity:.7;font-size:.82rem"></span></span>
      <button class="linkish" type="button" data-logout>Sign out</button>
    </div>
  </aside>
  <main class="main" id="main">
<div class="head">
      <div>
        <h1>Products</h1>
        <p>Publish a product to show it on the website. Drafts and archived products stay hidden.</p>
      </div>
      <a class="btn btn-red btn-sm" href="/admin/product-edit.html">Add a product</a>
    </div>
    <div id="list-alert" hidden></div>
    <div class="panel">
      <div class="filters">
        <div class="seg-tabs" role="group" aria-label="Show products by status" id="status-tabs">
          <button type="button" data-status="" aria-pressed="true">All<span class="n" data-n=""></span></button>
          <button type="button" data-status="published" aria-pressed="false">Published<span class="n" data-n="published"></span></button>
          <button type="button" data-status="draft" aria-pressed="false">Drafts<span class="n" data-n="draft"></span></button>
          <button type="button" data-status="archived" aria-pressed="false">Archived<span class="n" data-n="archived"></span></button>
        </div>
        <label class="sr" for="filter-q">Search products</label>
        <input class="input" id="filter-q" type="search" placeholder="Search by name" autocomplete="off">
      </div>
      <p class="sr" id="list-status" role="status" aria-live="polite"></p>
      <div id="list" aria-busy="true"><p class="list-empty">Loading products…</p></div>
    </div>
  </main>
</div>
<script type="module" src="/assets/js/admin/products.js"></script>
</body>
</html>
