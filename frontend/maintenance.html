<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opening this Diwali · Spice Mama</title>
<meta name="description" content="The Spice Mama website opens on Diwali, Sunday 8 November 2026.">
<meta name="theme-color" content="#FBF4E6">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/images/brand/logo-sm.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<style>
  /* Pre-launch page shown by public_html/.htaccess until the Diwali launch. Self-contained apart from tokens. */
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: var(--pad);
         background: var(--ivory); color: var(--ink); font: 400 var(--fs-body)/1.6 var(--body) }
  body > main { min-width: 0 }
  main { width: min(640px, 100%); text-align: center; display: grid; gap: 22px; justify-items: center }
  .logo { width: 180px; height: auto; background: var(--white); border-radius: var(--r-lg); padding: 10px 14px; box-shadow: var(--shadow-chip) }
  .eyebrow { margin: 0; color: var(--red); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: var(--fs-small) }
  h1 { margin: 0; font: 400 clamp(2.4rem, 7vw, 4.2rem)/1.05 var(--display); color: var(--ink) }
  .lead { margin: 0; color: var(--ink-soft); max-width: 34ch }
  .date { margin: 0; font-weight: 700; color: var(--green) }
  .count { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 4px 0 0; padding: 0; list-style: none }
  .count li { min-width: 76px; padding: 12px 10px 8px; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-md) }
  .count b { display: block; font: 400 2rem/1 var(--display); color: var(--red) }
  .count span { font-size: .78rem; color: var(--ink-soft) }
  .contact { margin: 6px 0 0; padding-top: 18px; border-top: 1px solid var(--line); font-size: var(--fs-small); color: var(--ink-soft); width: 100% }
  .contact a { color: var(--ink); font-weight: 600; text-decoration-color: var(--line-strong); overflow-wrap: anywhere }
  @media (prefers-reduced-motion: no-preference) { main { animation: rise .6s ease-out both } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) } }

  /* Pounding scene, cropped from the Guntur Gold pack art (see assets/images/SOURCES.md).
     A wide red stage gives the people room; the art sits centred with its side edges faded into it.
     The art is drawn twice: the man and mortar (left SPLIT of its width) squash from the bottom on
     each strike, so pestle and turban dip most and the mortar barely moves; the woman stays still.
     The art is 6% taller than the stage (anchored at the bottom) so the squash never uncovers its top. */
  .scene { --split: 40%; --beat: 1.1s; position: relative; width: clamp(260px, 82vw, 400px); aspect-ratio: 1 / 1;
           margin: 4px 0 2px; border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow-chip);
           background: radial-gradient(75% 75% at 50% 62%, #C5151B 0%, #B51419 50%, #96101A 100%) }
  .scene .art { position: absolute; left: 50%; bottom: 0; height: 106%; aspect-ratio: 327 / 545; transform: translateX(-50%);
                -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 4%, #000 76%, transparent 100%);
                mask-image: linear-gradient(90deg, transparent 0, #000 4%, #000 76%, transparent 100%) }
  .scene img { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
  .scene .still { clip-path: inset(0 0 0 var(--split)) }
  .scene .pounding { clip-path: inset(0 calc(100% - var(--split)) 0 0); transform-origin: 50% 100% }
  .scene .dust { position: absolute; left: 18%; top: 68%; width: 11px; height: 11px; margin: -5px; border-radius: 50%;
                 background: #F2A33A; opacity: 0; pointer-events: none }
  @media (prefers-reduced-motion: no-preference) {
    .scene .pounding { animation: pound var(--beat) ease-in-out infinite }
    .scene .dust { animation: puff var(--beat) ease-out infinite }
    .scene .dust:nth-of-type(2) { --dx: -18px; animation-delay: .04s; background: #E8833A }
    .scene .dust:nth-of-type(3) { --dx: 16px; animation-delay: .08s }
    .scene .dust:nth-of-type(4) { --dx: -6px; animation-delay: .02s; background: #F6C66B; width: 7px; height: 7px }
  }
  /* Lift slowly, strike fast at ~52%, settle. */
  @keyframes pound { 0%, 100% { transform: scaleY(1) } 42% { transform: scaleY(1.008) } 52% { transform: scaleY(.958) } 66% { transform: scaleY(1) } }
  @keyframes puff { 0%, 50% { opacity: 0; transform: translate(0, 0) scale(.4) }
                    56% { opacity: .9 } 90% { opacity: 0; transform: translate(var(--dx, 8px), -26px) scale(1.6) } 100% { opacity: 0 } }
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/images/brand/logo-sm.webp" width="320" height="201" alt="Oont Chap Spice Mama">
  <div class="scene" role="img" aria-label="Illustration: a man pounding red chillies in a stone mortar while a woman sorts dried chillies">
    <div class="art">
      <img class="still" src="/assets/images/campaign/pounding-scene.webp" width="327" height="545" alt="">
      <img class="pounding" src="/assets/images/campaign/pounding-scene.webp" width="327" height="545" alt="">
      <span class="dust"></span><span class="dust"></span><span class="dust"></span><span class="dust"></span>
    </div>
  </div>
  <p class="eyebrow">Our website is getting ready</p>
  <h1>Opening this Diwali</h1>
  <p class="lead">We are putting the finishing touches to the Spice Mama website. Please visit us again on Diwali.</p>
  <p class="date">Sunday, 8 November 2026</p>
  <ul class="count" id="count" aria-label="Time until launch" hidden>
    <li><b data-unit="d">0</b><span>days</span></li>
    <li><b data-unit="h">0</b><span>hours</span></li>
    <li><b data-unit="m">0</b><span>minutes</span></li>
  </ul>
  <p class="contact">Until then, reach us at <a href="tel:+919441547648">+91 94415 47648</a> or <a href="mailto:andhrastandardproducts@gmail.com">andhrastandardproducts@gmail.com</a></p>
</main>
<script>
  // Countdown to 00:00 IST on Sunday 8 November 2026 (= 2026-11-07 18:30 UTC). After that, reload into the live site.
  (() => {
    const launch = Date.UTC(2026, 10, 7, 18, 30);
    const box = document.getElementById('count');
    // Reload only when launch passes while the page is open; a page served after launch must not loop.
    const openedBefore = Date.now() < launch;
    const tick = () => {
      const left = launch - Date.now();
      if (left <= 0) { box.hidden = true; if (openedBefore) location.replace('/'); return; }
      const parts = { d: Math.floor(left / 864e5), h: Math.floor(left / 36e5) % 24, m: Math.floor(left / 6e4) % 60 };
      for (const [unit, value] of Object.entries(parts)) box.querySelector(`[data-unit="${unit}"]`).textContent = String(value);
      box.hidden = false;
    };
    tick();
    setInterval(tick, 30000);
  })();
</script>
</body>
</html>
